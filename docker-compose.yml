version: "3.8"

services:
  aria_node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria_node
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    volumes:
      - /dev/input:/dev/input
      - /dev:/dev
      - ./ros2_ws/maps:/ros2_ws/maps
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    command: /bin/bash
